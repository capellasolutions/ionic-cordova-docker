version: 2
updates:
  # Demo app npm dependencies (Angular / Ionic / Cordova).
  - package-ecosystem: npm
    directory: /example-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # The framework packages peer-depend on each other at the exact same version (@angular/common@22.2.5 wants
      # @angular/core@22.2.5), so a bump of just one of them fails `npm ci` with ERESOLVE. Keep them in one PR.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
        update-types: ['minor', 'patch']
      # A new major gets its own PR, so it doubles as the heads-up that the major is out. It will likely fail CI: check
      # out its branch and run the migrations Dependabot skips (`ng update <pkg> --migrate-only --from=<old>`). Keeping
      # it apart from the minor/patch group means one failing major doesn't sit in the same PR as routine bumps.
      angular-major:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
        update-types: ['major']

  # Base image (ubuntu) referenced by the canonical Docker files.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Base image referenced by the demo's mirrored Docker files.
  - package-ecosystem: docker
    directory: /example-app
    schedule:
      interval: weekly

  # The GitHub Actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
