version: 2
updates:
  # Demo app npm dependencies (Angular / Ionic / Cordova).
  - package-ecosystem: npm
    directory: /example-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # The framework packages peer-depend on each other at the exact same version (@angular/common@22.2.5 wants
      # @angular/core@22.2.5), so a bump of just one of them fails `npm ci` with ERESOLVE. Keep them in one PR.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
    ignore:
      # Angular majors go through `ng update`, which runs the schematic migrations; a Dependabot major bump would
      # only be a broken partial upgrade.
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-eslint/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'angular-eslint'
        update-types: ['version-update:semver-major']

  # Base image (ubuntu) referenced by the canonical Docker files.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Base image referenced by the demo's mirrored Docker files.
  - package-ecosystem: docker
    directory: /example-app
    schedule:
      interval: weekly

  # The GitHub Actions used by the CI workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
