name: build

on:
  push:
    branches: [master, main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  # The root Dockerfile / app-builder.Dockerfile are the source of truth; example-app
  # carries identical copies so the demo can be cloned and built standalone. Fail fast
  # if they ever drift apart. (build-mobile.sh is intentionally different and excluded.)
  drift-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: example-app Docker files must match the canonical root files
        run: |
          diff -u Dockerfile example-app/Dockerfile
          diff -u app-builder.Dockerfile example-app/app-builder.Dockerfile

  # Lint, build and unit-test the demo app (fast, catches Angular/Ionic breakage).
  app-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: example-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build -- --configuration=production
      - run: npm test -- --watch=false

  # End-to-end proof of the Docker pipeline: build the toolchain image, then build the
  # demo Android app on top of it. Heavy (downloads the Android SDK and runs Gradle).
  docker-image:
    runs-on: ubuntu-latest
    needs: drift-guard
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build the toolchain base image
        run: docker build . -f ./app-builder.Dockerfile -t app-builder
      - name: The toolchain image must carry the SDK it says it does
        # sdkmanager exits 0 for packages it silently skips, and the Android CLI that now backs it
        # prints no install output, so assert on disk that the pinned and the staged SDK both landed.
        run: |
          docker run --rm app-builder sh -c '
            set -eu
            for pkg in platforms/android-$ANDROID_PLATFORMS_VERSION \
                       build-tools/$ANDROID_BUILD_TOOLS_VERSION \
                       $(echo "$ANDROID_EXTRA_PACKAGES" | tr ";" "/"); do
              test -d "$ANDROID_SDK_ROOT/$pkg" || { echo "MISSING: $pkg"; exit 1; }
              echo "present: $pkg"
            done'
      - name: Build the demo app (Android) end-to-end
        working-directory: example-app
        run: |
          docker build . \
            --build-arg ENV_NAME=prod \
            --build-arg PACKAGE_ID=com.example.app \
            --build-arg PLATFORM=android \
            --build-arg VERSION=0.0.1 \
            -f ./Dockerfile \
            -t app-build
